#fff4}.dot.active{background:#fff;transform:scale(1.2);box-shadow:0 0 7px #fff8}.dock{width:min(100%,410px);height:72px;padding:7px;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;border-radius:25px;border:1px solid #fff3;background:#343841a8;box-shadow:0 18px 45px #000b,inset 0 1px #fff2;backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}.dock .app{border-radius:18px;overflow:hidden}.dock .icon{border-radius:18px}.dock .label{display:none}.bottom{display:flex;flex-direction:column;align-items:center}.home{width:126px;height:5px;border-radius:8px;background:#fff;margin:8px 0 1px;box-shadow:0 1px 5px #000}.sheet-bg,.manage-panel,.library-panel{position:fixed;inset:0;z-index:20;background:#0009;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:.22s;display:grid;place-items:end center;padding:12px}.sheet-bg.open,.manage-panel.open,.library-panel.open{opacity:1;pointer-events:auto}.sheet,.manage-card,.library-card{width:min(100%,600px);max-height:min(760px,91svh);overflow:auto;border:1px solid #fff2;border-radius:28px;background:#171a21f5;box-shadow:0 28px 90px #000d,inset 0 1px #fff2;padding:19px}.sheet h2,.manage-card h2,.library-card h2{margin:0 0 6px;font-size:21px}.sheet p,.manage-card p,.library-card p{margin:0 0 15px;color:#bfc4cd;font-size:13px;line-height:1.45}.sheet button{width:100%;border:0;border-radius:15px;padding:12px;margin-top:7px;background:#fff1;color:#fff;text-align:left}.sheet .primary,.manage-close{background:#168cff;font-weight:800}.toast{position:fixed;z-index:40;left:50%;bottom:108px;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:#171a20ee;border:1px solid #fff2;border-radius:18px;padding:10px 15px;font-size:13px;font-weight:700;transition:.22s;white-space:nowrap;box-shadow:0 13px 40px #0009}.toast.show{opacity:1;transform:translate(-50%,0)}.editing .app{animation:jiggle .17s infinite alternate}.editing .app:nth-child(2n){animation-delay:-.08s}@key <body><div class="bg"></div><main class="shell" id="shell"><div class="status"><span id="time">9:41</span><div class="status-right"><span class="signal">▮▮▮</span><span>⌁</span><span class="battery"><i></i></span></div></div><div class="top"><div class="brand">Aither <span>Apps</span></div><div class="top-actions"><button class="glass-btn" id="libraryBtn">Library</button><button class="glass-btn" id="manage">Manage</button><button class="glass-btn" id="edit">Edit</button></div></div><label class="search" id="searchBox" aria-label="Search Aither apps"><span class="search-icon">⌕</span><input id="search" type="search" placeholder="Search Apps" autocomplete="off" enterkeyhint="search"><button class="clear" id="clearSearch" aria-label="Clear search">×</button></label><section class="pages" id="pages" aria-live="polite"></section><footer class="bottom"><div class="dots" id="dots"></div><nav class="dock" id="dock" aria-label="Dock"></nav><div class="home"></div></footer></main><div class="toast" id="toast" role="status"></div><div class="sheet-bg" id="modal"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><h2 id="sheetTitle"></h2><p id="sheetText"></p><button class="primary" id="openBtn">Open</button><button id="closeBtn">Close</button></div></div><div class="manage-panel" id="managePanel"><div class="manage-card" role="dialog" aria-modal="true"><h2>Manage Aither Apps</h2><p>Connected apps open directly. Your launcher state and last-used apps are stored locally on this device.</p><div id="manageList"></div><button class="manage-close" id="manageClose">Done</button></div></div><div class="library-panel" id="libraryPanel"><div class="library-card" role="dialog" aria-modal="true"><h2>App Library</h2><p>Every Aither app in one place.</p><div class="library-grid" id="libraryGrid"></div><div class="hint">Swipe left or right on the Home Screen to change pages.</div><button class="manage-close" id="libraryClose">Done</button></div></div><script>
const BASE='https://aitherforge.github.io';
const A=[['Email','✉',BASE+'/AitherMail/',0],['Texting','•••','',1],['Settings','⚙',BASE+'/AitherDashboard/',2],['Passwords','●','',3],['Photos','✿','',4],['Camera','●','',5],['Aither AI','✣',BASE+'/AitherAI/',6],['App Store','A','',7],['Tips','✦','',8],['Help','?','',9],['Document Viewing','▤',BASE+'/AitherFiles/',10],['Contacts','●','',11],['Calling','☎','',12],['Shortcuts','◆','',13],['Browser','◎',BASE+'/AitherWeb/',14],['Calculator','＋',BASE+'/AitherCalculator/',15],['Maps','●',BASE+'/AitherMaps/',16],['Clock','◷',BASE+'/AitherClock/',17],['Weather','☁',BASE+'/AitherWeather/',18],['Notes / Document','▤',BASE+'/AitherNotes/',19]];
const D=['Calling','Browser','Notes / Document','Settings'];const P=document.getElementById('pages'),dots=document.getElementById('dots'),dock=document.getElementById('dock'),search=document.getElementById('search'),searchBox=document.getElementById('searchBox'),shell=document.getElementById('shell'),modal=document.getElementById('modal'),toast=document.getElementById('toast'),managePanel=document.getElementById('managePanel'),libraryPanel=document.getElementById('libraryPanel'),manageList=document.getElementById('manageList'),libraryGrid=document.getElementById('libraryGrid');let page=Number(localStorage.getItem('aitherapps.page')||0),selected=null,editing=false,startX=0;const launchable=a=>Boolean(a[2]);function pos(i){const c=i%5,r=Math.floor(i/5);return `${c*25}% ${r*100/3}%`}function card(a){const b=document.createElement('button');b.className='app';b.type='button';b.dataset.name=a[0].toLowerCase();b.setAttribute('aria-label',a[0]);b.setAttribute('aria-disabled',launchable(a)?'false':'true');const ic=document.createElement('span');ic.className='icon icon-art';ic.style.backgroundPosition=pos(a[3]);const g=document.createElement('span');g.className='glyph';g.textContent=a[1];ic.appendChild(g);const l=document.createElement('span');l.className='label';l.textContent=a[0];b.append(ic,l);b.onclick=()=>launch(a);return b}function mini(a){const s=document.createElement('span');s.className='mini-icon';s.style.backgroundPosition=pos(a[3]);return s}function launch(a){if(editing)return;if(a[2]){localStorage.setItem('aitherapps.last',a[0]);location.href=a[2];return}selected=a;document.getElementById('sheetTitle').textContent=a[0];document.getElementById('sheetText').textContent=a[0]+' is not connected yet. The launcher is ready for a future Aither service.';document.getElementById('openBtn').textContent='Coming Soon';modal.classList.add('open')}function size(){return innerWidth<=800?12:15}function render(){P.innerHTML='';dots.innerHTML='';const n=size();for(let i=0;i<A.length;i+=n){const p=document.createElement('div');p.className='page';A.slice(i,i+n).forEach(a=>p.appendChild(card(a)));P.appendChild(p);const d=document.createElement('button');d.type='button';d.className='dot';d.setAttribute('aria-label','Page '+(i/n+1));d.onclick=()=>go(i/n);dots.appendChild(d)}page=Math.min(page,Math.max(0,P.children.length-1));go(page);dock.innerHTML='';D.forEach(name=>{const a=A.find(x=>x[0]===name);if(a)dock.appendChild(card(a))})}function go(n){if(!P.children.length)return;page=Math.max(0,Math.min(n,P.children.length-1));localStorage.setItem('aitherapps.page',page);[...P.children].forEach((x,i)=>x.classList.toggle('active',i===page));[...dots.children].forEach((x,i)=>x.classList.toggle('active',i===page))}function doSearch(){const q=search.value.trim().toLowerCase();searchBox.classList.toggle('has-value',!!q);document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',!!q));document.querySelectorAll('.page .app').forEach(a=>a.style.display=!q||a.dataset.name.includes(q)?'':'none');document.querySelectorAll('.dot').forEach(d=>d.classList.toggle('active',!!q));if(!q)go(page)}search.oninput=doSearch;document.getElementById('clearSearch').onclick=()=>{search.value='';doSearch();search.focus()};document.getElementById('edit').onclick=()=>{editing=!editing;shell.classList.toggle('editing',editing);document.getElementById('edit').textContent=editing?'Done':'Edit';show(editing?'Home Screen editing':'Done')};document.getElementById('closeBtn').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};document.getElementById('openBtn').onclick=()=>{modal.classList.remove('open');show((selected?selected[0]:'App')+' is coming soon')};document.getElementById('manage').onclick=()=>{renderManage();managePanel.classList.add('open')};document.getElementById('manageClose').onclick=()=>managePanel.classList.remove('open');managePanel.onclick=e=>{if(e.target===managePanel)managePanel.classList.remove('open')};function renderManage(){manageList.innerHTML='';A.forEach(a=>{const row=document.createElement('div');row.className='manage-row';row.innerHTML='<div><strong>'+a[0]+'</strong><small>'+(launchable(a)?'Connected':'Not connected')+'</small></div><button type="button">'+(launchable(a)?'Open':'Info')+'</button>';row.querySelector('button').onclick=()=>{managePanel.classList.remove('open');launch(a)};manageList.appendChild(row)})}document.getElementById('libraryBtn').onclick=()=>{libraryGrid.innerHTML='';A.forEach(a=>{const b=document.createElement('button');b.className='library-item';b.type='button';b.append(mini(a));const t=document.createElement('span');t.innerHTML='<strong>'+a[0]+'</strong><small>'+(launchable(a)?'Connected':'Coming soon')+'</small>';b.appendChild(t);b.onclick=()=>{libraryPanel.classList.remove('open');launch(a)};libraryGrid.appendChild(b)});libraryPanel.classList.add('open')};document.getElementById('libraryClose').onclick=()=>libraryPanel.classList.remove('open');libraryPanel.onclick=e=>{if(e.target===libraryPanel)libraryPanel.classList.remove('open')};P.ontouchstart=e=>startX=e.touches[0].clientX;P.ontouchend=e=>{if(search.value)return;const dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>45)go(page+(dx<0?1:-1))};function show(t){toast.textContent=t;toast.classList.add('show');clearTimeout(show.t);show.t=setTimeout(()=>toast.classList.remove('show'),1600)}function tick(){document.getElementById('time').textContent=new Intl.DateTimeFormat([], {hour:'numeric',minute:'2-digit'}).format(new Date())}tick();setInterval(tick,15000);addEventListener('resize',render);addEventListener('keydown',e=>{if(e.key==='Escape'){modal.classList.remove('open');managePanel.classList.remove('open');libraryPanel.classList.remove('open')}if(!search.value&&!editing&&(e.key==='ArrowRight'||e.key==='ArrowLeft'))go(page+(e.key==='ArrowRight'?1:-1));if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();search.focus()}});render();

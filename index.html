<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Aither Apps</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}body{user-select:none;overscroll-behavior:none}.bg{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 5%,#173f79 0,#07172d 27%,transparent 55%),radial-gradient(circle at 0 90%,#063d76 0,transparent 36%),radial-gradient(circle at 100% 85%,#28115f 0,transparent 35%),#000}.bg:after{content:"";position:absolute;inset:0;background:radial-gradient(circle,transparent 35%,#0008 100%)}button,input{font:inherit}.shell{position:relative;z-index:2;height:100svh;width:min(100%,1180px);margin:auto;padding:max(6px,env(safe-area-inset-top)) 9px max(5px,env(safe-area-inset-bottom));display:flex;flex-direction:column}.status{height:28px;display:flex;justify-content:space-between;align-items:center;padding:0 8px;font-size:15px;font-weight:700;text-shadow:0 2px 8px #000}.right{display:flex;align-items:center;gap:7px;font-size:11px}.signal{letter-spacing:-3px}.battery{width:25px;height:12px;border:1.5px solid #fff;border-radius:4px;padding:1px;position:relative}.battery:after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:5px;background:#fff}.battery i{display:block;width:82%;height:100%;background:#fff;border-radius:2px}.top{height:39px;display:flex;align-items:center;justify-content:space-between;padding:0 7px}.brand{font-size:18px;font-weight:750}.brand span{opacity:.45;font-weight:500}.top-actions{display:flex;gap:7px}.edit,.manage{border:1px solid #fff2;background:#fff2;color:#fff;border-radius:17px;padding:7px 13px;font-size:12px;font-weight:700;backdrop-filter:blur(18px)}.search{height:34px;margin:0 7px 8px;display:flex;align-items:center;gap:7px;padding:0 11px;border:1px solid #fff2;border-radius:12px;background:#252932aa;backdrop-filter:blur(22px)}.search input{width:100%;border:0;outline:0;background:transparent;color:#fff;font-size:13px}.search input::placeholder{color:#d0d3d8}.pages{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:pan-y}.page{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-content:start;gap:12px 8px;padding:4px 1px;opacity:0;transform:translateX(24px);pointer-events:none;transition:.22s ease}.page.active{opacity:1;transform:none;pointer-events:auto}.app{border:0;background:transparent;padding:0;min-width:0;cursor:pointer;transition:transform .14s ease,filter .14s ease}.app:active{transform:scale(.9);filter:brightness(1.2)}.app[aria-disabled="true"]{opacity:.48}.icon{position:relative;width:100%;aspect-ratio:95/84;border-radius:8px;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 25%,#245aa2,#0a2046 50%,#02050b 100%);border:1px solid #8bd3ff88;box-shadow:0 6px 17px #0008,0 0 12px #008cff25,inset 0 0 18px #006dff25}.icon:before{content:"";position:absolute;inset:7%;clip-path:polygon(50% 0,92% 22%,100% 78%,50% 100%,0 78%,8% 22%);border:2px solid #d7efff;filter:drop-shadow(0 0 5px #178dff)}.icon:after{content:"";position:absolute;inset:0;background:linear-gradient(125deg,#fff3,transparent 27%,transparent 65%,#0785ff18)}.glyph{position:relative;z-index:2;color:#f7fbff;font-size:31px;font-weight:700;line-height:1;filter:drop-shadow(0 0 7px #168cff);text-shadow:0 0 7px #168cff}.label{display:block;margin-top:4px;height:17px;overflow:hidden;text-align:center;font-size:9px;font-weight:650;letter-spacing:.2px;text-shadow:0 2px 6px #000}.dots{height:17px;display:flex;align-items:center;justify-content:center;gap:6px}.dot{width:6px;height:6px;padding:0;border:0;border-radius:50%;background:#fff5}.dot.active{background:#fff;transform:scale(1.15)}.dock{width:min(100%,410px);height:70px;padding:7px;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;border-radius:24px;border:1px solid #fff2;background:#34363da6;backdrop-filter:blur(28px);box-shadow:0 15px 40px #0009}.dock .app{border-radius:17px;overflow:hidden}.dock .icon{border-radius:17px}.dock .label{display:none}.bottom{display:flex;flex-direction:column;align-items:center}.home{width:126px;height:5px;border-radius:8px;background:#fff;margin:8px 0 1px;box-shadow:0 1px 4px #000}.sheet-bg{position:fixed;inset:0;z-index:20;display:grid;place-items:end center;background:#0008;backdrop-filter:blur(7px);opacity:0;pointer-events:none;transition:.2s}.sheet-bg.open{opacity:1;pointer-events:auto}.sheet{width:min(100%,560px);margin:0 10px max(10px,env(safe-area-inset-bottom));padding:18px;border:1px solid #fff2;border-radius:27px;background:#1c1e24f5;box-shadow:0 25px 80px #000c}.sheet h2{margin:0 0 6px;font-size:20px}.sheet p{margin:0 0 14px;color:#c3c6cc;font-size:13px}.sheet button{width:100%;border:0;border-radius:15px;padding:12px;margin-top:7px;background:#fff1;color:#fff;text-align:left}.sheet .primary{background:#168cff;font-weight:700}.toast{position:fixed;z-index:30;left:50%;bottom:104px;transform:translate(-50%,14px);opacity:0;pointer-events:none;background:#1b1d22ed;border:1px solid #fff2;border-radius:17px;padding:10px 15px;font-size:13px;font-weight:650;transition:.2s;white-space:nowrap;box-shadow:0 12px 35px #0008}.toast.show{opacity:1;transform:translate(-50%,0)}.editing .app{animation:jiggle .16s infinite alternate}.editing .app:nth-child(2n){animation-delay:-.08s}@keyframes jiggle{from{transform:rotate(-.7deg)}to{transform:rotate(.7deg)}}.manage-panel{position:fixed;inset:0;z-index:25;background:#0009;backdrop-filter:blur(8px);display:none;place-items:center;padding:18px}.manage-panel.open{display:grid}.manage-card{width:min(520px,100%);max-height:min(720px,90svh);overflow:auto;border:1px solid #fff2;border-radius:25px;background:#1b1e24f7;padding:20px}.manage-card h2{margin:0 0 5px}.manage-card p{margin:0 0 15px;color:#b9bec7;font-size:13px}.manage-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #fff1}.manage-row:last-child{border-bottom:0}.manage-row strong{display:block;font-size:14px}.manage-row small{color:#9ca4af}.manage-row button{border:1px solid #fff2;border-radius:12px;background:#fff1;color:#fff;padding:8px 11px}.manage-close{width:100%;margin-top:15px;border:0;border-radius:14px;background:#168cff;color:#fff;padding:12px;font-weight:800}@media(max-width:800px){.page{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 6px}.brand{font-size:17px}.dock{width:min(100%,385px)}}@media(max-width:390px){.page{gap:8px 5px}.label{font-size:8px}.search{margin-bottom:6px}.dock{height:64px}.home{margin-top:7px}}@media(min-width:801px){.shell{padding:15px 28px 10px}.status{display:none}.top{height:48px}.search{max-width:540px}.page{grid-template-columns:repeat(5,minmax(0,1fr));gap:14px 10px;padding:8px}.dock{height:74px}}</style></head><body><div class="bg"></div><main class="shell" id="shell"><div class="status"><span id="time">9:41</span><div class="right"><span class="signal">▮▮▮</span><span>⌁</span><span class="battery"><i></i></span></div></div><div class="top"><div class="brand">Aither <span>Apps</span></div><div class="top-actions"><button class="manage" id="manage">Manage</button><button class="edit" id="edit">Edit</button></div></div><label class="search" aria-label="Search Aither apps"><span>⌕</span><input id="search" type="search" placeholder="Search Apps" autocomplete="off"></label><section class="pages" id="pages" aria-live="polite"></section><footer class="bottom"><div class="dots" id="dots"></div><nav class="dock" id="dock" aria-label="Dock"></nav><div class="home"></div></footer></main><div class="toast" id="toast" role="status"></div><div class="sheet-bg" id="modal"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><h2 id="sheetTitle"></h2><p id="sheetText"></p><button class="primary" id="openBtn">Open</button><button id="closeBtn">Close</button></div></div><div class="manage-panel" id="managePanel"><div class="manage-card" role="dialog" aria-modal="true" aria-labelledby="manageTitle"><h2 id="manageTitle">Aither Apps</h2><p>Manage your launcher. Apps that are connected open directly; placeholders stay available for future Aither services.</p><div id="manageList"></div><button class="manage-close" id="manageClose">Done</button></div></div><script>const BASE='https://aitherforge.github.io';const A=[['Email','✉',''],['Texting','•••',''],['Settings','⚙',''],['Passwords','●',''],['Photos','✿',''],['Camera','●',''],['Aither AI','✣',BASE+'/AitherAI/'],['App Store','A',''],['Tips','✦',''],['Help','?',''],['Document Viewing','▤',''],['Contacts','●',''],['Calling','☎',''],['Shortcuts','◆',''],['Browser','◎',BASE+'/AitherWeb/'],['Calculator','＋',BASE+'/AitherCalculator/'],['Maps','●',BASE+'/AitherMaps/'],['Clock','◷',BASE+'/AitherClock/'],['Weather','☁',BASE+'/AitherWeather/'],['Notes / Document','▤',BASE+'/AitherNotes/']];const D=['Calling','Browser','Notes / Document','Settings'];const P=document.getElementById('pages'),dots=document.getElementById('dots'),dock=document.getElementById('dock'),search=document.getElementById('search'),shell=document.getElementById('shell'),modal=document.getElementById('modal'),toast=document.getElementById('toast'),managePanel=document.getElementById('managePanel'),manageList=document.getElementById('manageList');let page=0,selected=null,editing=false,startX=0;const launchable=a=>Boolean(a[2]);function card(a){const b=document.createElement('button');b.className='app';b.type='button';b.dataset.name=a[0].toLowerCase();b.setAttribute('aria-label',a[0]);b.setAttribute('aria-disabled',launchable(a)?'false':'true');b.innerHTML='<span class="icon"><span class="glyph">'+a[1]+'</span></span><span class="label">'+a[0]+'</span>';b.onclick=()=>launch(a);return b}function launch(a){if(editing)return;if(a[2]){location.href=a[2];return}selected=a;document.getElementById('sheetTitle').textContent=a[0];document.getElementById('sheetText').textContent=a[0]+' is not connected yet. It is ready for a future Aither service.';document.getElementById('openBtn').textContent='Coming Soon';modal.classList.add('open');document.getElementById('closeBtn').focus()}function size(){return innerWidth<=800?12:15}function render(){P.innerHTML='';dots.innerHTML='';const n=size();for(let i=0;i<A.length;i+=n){const p=document.createElement('div');p.className='page';A.slice(i,i+n).forEach(a=>p.appendChild(card(a)));P.appendChild(p);const d=document.createElement('button');d.type='button';d.className='dot';d.setAttribute('aria-label','Page '+(i/n+1));d.onclick=()=>go(i/n);dots.appendChild(d)}page=Math.min(page,Math.max(0,P.children.length-1));go(page);dock.innerHTML='';D.forEach(name=>{const a=A.find(x=>x[0]===name);if(a)dock.appendChild(card(a))})}function go(n){if(!P.children.length)return;page=Math.max(0,Math.min(n,P.children.length-1));[...P.children].forEach((x,i)=>x.classList.toggle('active',i===page));[...dots.children].forEach((x,i)=>x.classList.toggle('active',i===page))}function doSearch(){const q=search.value.trim().toLowerCase();document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',!!q));document.querySelectorAll('.page .app').forEach(a=>a.style.display=!q||a.dataset.name.includes(q)?'':'none');document.querySelectorAll('.dot').forEach(d=>d.classList.toggle('active',!!q));if(!q)go(page)}search.oninput=doSearch;document.getElementById('edit').onclick=()=>{editing=!editing;shell.classList.toggle('editing',editing);document.getElementById('edit').textContent=editing?'Done':'Edit';show(editing?'Home Screen editing':'Done')};document.getElementById('closeBtn').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};document.getElementById('openBtn').onclick=()=>{modal.classList.remove('open');show((selected?selected[0]:'App')+' is coming soon')};document.getElementById('manage').onclick=()=>{renderManage();managePanel.classList.add('open');document.getElementById('manageClose').focus()};document.getElementById('manageClose').onclick=()=>managePanel.classList.remove('open');managePanel.onclick=e=>{if(e.target===managePanel)managePanel.classList.remove('open')};function renderManage(){manageList.innerHTML='';A.forEach(a=>{const row=document.createElement('div');row.className='manage-row';row.innerHTML='<div><strong>'+a[0]+'</strong><small>'+(launchable(a)?'Connected':'Not connected')+'</small></div><button type="button">'+(launchable(a)?'Open':'Info')+'</button>';row.querySelector('button').onclick=()=>launch(a);manageList.appendChild(row)})}P.ontouchstart=e=>startX=e.touches[0].clientX;P.ontouchend=e=>{if(search.value)return;const dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>45)go(page+(dx<0?1:-1))};function show(t){toast.textContent=t;toast.classList.add('show');clearTimeout(show.t);show.t=setTimeout(()=>toast.classList.remove('show'),1500)}function tick(){document.getElementById('time').textContent=new Intl.DateTimeFormat([], {hour:'numeric',minute:'2-digit'}).format(new Date())}tick();setInterval(tick,15000);addEventListener('resize',render);addEventListener('keydown',e=>{if(e.key==='Escape'){modal.classList.remove('open');managePanel.classList.remove('open')}if(!search.value&&!editing&&(e.key==='ArrowRight'||e.key==='ArrowLeft'))go(page+(e.key==='ArrowRight'?1:-1))});render();</script><script src="aither-account.js?v=3"></script></body></html>
